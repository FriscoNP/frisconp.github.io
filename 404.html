<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Page not found — Frisco</title>
    <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">
    <script src="/assets/js/theme.js"></script>
</head>

<body>
    <header class="nav">
        <div class="nav__inner">
            <a href="/" class="nav__logo">Frisco</a>
            <div class="nav__controls">
                <button id="themeToggle" class="btn btn--outline btn--icon" type="button" aria-pressed="false" title="Light / dark theme">
                    <svg class="icon theme-sun" aria-hidden="true"><use href="/assets/img/icons.svg#i-sun"></use></svg><svg class="icon theme-moon" aria-hidden="true"><use href="/assets/img/icons.svg#i-moon"></use></svg><span class="sr-only">Toggle dark mode</span>
                </button>
            </div>
        </div>
    </header>

    <main>
        <section class="section container">
            <div class="card panel">
                <h1>404 — Page not found</h1>
                <p>The page you're looking for doesn't exist or has moved.</p>
                <a class="btn" href="/"><svg class="icon" aria-hidden="true"><use href="/assets/img/icons.svg#i-arrow-left"></use></svg> Back to home</a>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>© 2026 Frisco Nirwana Putra</p>
    </footer>
</body>

</html>
